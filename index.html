<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEED Lab | 지능형 전력전자 연구실 · PKNU</title>
<meta name="author" content="Prof. Jun-Hyung Jung">
<meta name="description" content="지능형 전력전자 연구실 (Smart Power Electronics & Electric Drives Laboratory, SPEED Lab), 국립부경대학교 제어계측공학전공">
<meta name="keywords" content="SPEED Lab, 지능형 전력전자 연구실, 정준형, Jun-Hyung Jung, 국립부경대학교, PKNU, 전력전자, 전동기 드라이브, Power Electronics, Motor Drives, Multilevel Converter, Reinforcement Learning">
<meta property="og:title" content="SPEED Lab | PKNU">
<meta property="og:description" content="Smart Power Electronics & Electric Drives Laboratory · 지능형 전력전자 연구실">
<meta property="og:type" content="website">
<meta property="og:image" content="images/research_overview.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2312303C'/%3E%3Cpath d='M4 22h5V10h5v12h5V10h5v12h4' fill='none' stroke='%23D9853F' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F2EE; --paper-2:#E9E8E2; --card:#FFFFFF; --ink:#15191C; --ink-70:#3A4248; --ink-50:#626A70;
  --deep:#12303C; --deep-2:#0B2029; --copper:#B8612A; --copper-lt:#D9853F;
  --line:#D6D5CD; --line-dark:#284753;
  --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(16px,5vw,64px); --maxw:1160px;
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.72;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:break-word;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.028em;line-height:1.28}
p{margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}
.block{padding-block:clamp(44px,6vw,80px)}
.block.tight{padding-top:0}
.alt{background:var(--paper-2)}
.rel{position:relative}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-50)}

/* ---------- top bar ---------- */
header.bar{position:sticky;top:0;z-index:50;background:var(--deep-2);color:#E6ECEC;border-bottom:1px solid #06161C}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);display:flex;align-items:center;gap:22px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto;color:#fff}
.brand svg{width:26px;height:26px;flex:0 0 auto}
.brand b{font-size:17px;letter-spacing:-.035em}
.brand span{font-family:var(--mono);font-size:11px;color:#8FA7AF;letter-spacing:.04em}
nav.main{margin-left:auto;display:flex;gap:clamp(12px,1.9vw,26px);overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{font-size:15px;font-weight:600;text-decoration:none;color:#C9D5D8;white-space:nowrap;padding:19px 0 17px;border-bottom:2px solid transparent;transition:color .15s}
nav.main a:hover{color:#fff}
nav.main a.on{color:#fff;border-bottom-color:var(--copper-lt)}
.langbtn{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;background:none;border:1px solid #37535E;border-radius:2px;padding:5px 9px;cursor:pointer;color:#A9BCC2}
.langbtn:hover{border-color:#fff;color:#fff}
@media(max-width:960px){
  .bar-in{height:auto;flex-wrap:wrap;padding-top:10px;gap:4px 12px}
  nav.main{order:3;width:100%;margin-left:0;gap:18px}
  nav.main a{padding:8px 0 10px}
  .langbtn{margin-left:auto}
}

/* ---------- page heads ---------- */
.page{display:none}
.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.phead{background:var(--deep);color:#EEF2F2;padding-block:clamp(40px,6vw,68px) clamp(30px,4vw,44px);position:relative;overflow:hidden}
.phead .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--copper-lt)}
.phead h1{font-size:clamp(30px,5vw,46px);margin-top:8px;letter-spacing:-.04em}
.phead p.s{margin-top:10px;color:#A9BCC2;font-size:15px;max-width:70ch}
.phead svg.trace{position:absolute;right:0;bottom:0;width:min(560px,70%);height:auto;opacity:.5;pointer-events:none}
.sec-h{font-size:clamp(21px,2.6vw,26px);margin-bottom:22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec-h small{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--copper);font-weight:500}
.list-h{font-size:17px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:6px;position:relative}
.lede{font-size:clamp(16px,1.9vw,18px);line-height:1.85;color:#222A2F;max-width:72ch}

/* ---------- home hero ---------- */
.hero{background:var(--deep);color:#EDEFEE;padding-top:clamp(44px,7vw,84px);overflow:hidden}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#9DB3BB}
.hero h1{font-size:clamp(36px,7.4vw,72px);letter-spacing:-.05em;line-height:1.08;margin-top:14px}
.hero .en{margin-top:12px;font-size:clamp(15px,2.3vw,20px);font-weight:600;color:#D6E0E3;letter-spacing:-.02em}
.hero .en b{color:var(--copper-lt)}
.hero .thesis{margin-top:24px;font-size:clamp(16px,2.2vw,19px);line-height:1.7;max-width:40ch;color:#E4EAEA;border-left:2px solid var(--copper-lt);padding-left:16px}
.recruit{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:15px 18px;border:1px solid var(--line-dark);background:rgba(255,255,255,.04);max-width:780px}
.recruit .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--copper);color:#fff;padding:4px 8px;border-radius:2px;white-space:nowrap}
.recruit .txt{flex:1 1 260px;font-size:15px;color:#DCE5E7;min-width:0}
.recruit a{text-decoration:none;font-size:14px;padding:9px 16px;border-radius:2px;background:#fff;color:var(--deep);font-weight:700;white-space:nowrap}
.pwm{margin-top:clamp(26px,4.5vw,48px);width:100%;height:auto;display:block;overflow:visible}
.pwm-cap{display:grid;grid-template-columns:21% 1fr 25%;gap:10px;font-family:var(--mono);font-size:11px;color:#7E98A1;padding:8px 0 20px}
.pwm-cap span:nth-child(2){text-align:center}.pwm-cap span:last-child{text-align:right}
@media(max-width:620px){.pwm-cap{font-size:9.5px;gap:4px}}

/* focus + intro */
.focus-grid{display:grid;gap:clamp(26px,4vw,56px);grid-template-columns:1fr}
@media(min-width:900px){.focus-grid{grid-template-columns:1fr 1.1fr}}
.focus{list-style:none;margin:0;padding:0;counter-reset:f}
.focus li{counter-increment:f;display:grid;grid-template-columns:40px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;position:relative}
.focus li::before{content:counter(f,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--copper);font-weight:500;padding-top:3px}
.figure{margin-top:clamp(30px,4vw,44px);background:#fff;border:1px solid var(--line);padding:clamp(12px,2vw,24px);position:relative}
.figure img{width:100%;height:auto;margin:0 auto}
.figure figcaption{font-family:var(--mono);font-size:11.5px;color:var(--ink-50);margin-top:10px;text-align:center}

/* research area cards */
.areas{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:820px){.areas{grid-template-columns:repeat(3,1fr)}}
.area{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--deep);padding:22px 22px 20px;position:relative}
.area .n{font-family:var(--mono);font-size:11.5px;color:var(--copper);letter-spacing:.08em}
.area h3{font-size:18.5px;margin-top:6px}
.area .tag{font-size:13.5px;color:var(--ink-50);margin-top:4px}
.area ul{margin:14px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--ink-70)}
.area li{padding:6px 0 6px 16px;border-top:1px solid #ECEBE6;position:relative}
.area li::before{content:"";position:absolute;left:0;top:17px;width:7px;height:1.5px;background:var(--copper)}

/* research page rows */
.arow{display:grid;gap:clamp(18px,3vw,40px);grid-template-columns:1fr;padding:clamp(24px,3vw,36px) 0;border-top:1px solid var(--line);position:relative}
.arow:last-child{border-bottom:1px solid var(--line)}
@media(min-width:880px){.arow.nopic{grid-template-columns:1fr}}
@media(min-width:880px){.arow{grid-template-columns:1fr 1.15fr;align-items:center}}
.arow .pic{background:#fff;border:1px solid var(--line);padding:14px;min-height:120px;display:flex;align-items:center;justify-content:center;position:relative}
.arow .pic img{width:100%;height:auto}
.arow .n{font-family:var(--mono);font-size:12px;color:var(--copper);letter-spacing:.08em}
.arow h3{font-size:clamp(20px,2.4vw,24px);margin-top:4px}
.arow .tag{color:var(--ink-50);margin-top:4px;font-size:14.5px}
.arow ul{margin:14px 0 0;padding-left:18px;color:var(--ink-70);font-size:15px}
.arow li{padding:2px 0}
.ph-empty{width:100%;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-50);font-family:var(--mono);font-size:11px;line-height:1.7;padding:12px;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(18,48,60,.04) 8px 16px)}

/* projects */
.projects{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:760px){.projects{grid-template-columns:1fr 1fr}}
.proj{background:var(--card);border:1px solid var(--line);position:relative}
.proj .thumb{aspect-ratio:16/9;background:var(--paper-2);overflow:hidden;border-bottom:1px solid var(--line);position:relative}
.proj .thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.proj .body{padding:16px 20px 18px}
.proj .status{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#fff;background:#6B7A82;padding:3px 7px;border-radius:2px;display:inline-block}
.proj .status.ongoing{background:#2E7D57}.proj .status.completed{background:#3F5E6B}.proj .status.planned{background:#8A9299}
.proj h3{font-size:18px;margin-top:10px}
.proj .meta{font-family:var(--mono);font-size:12px;color:var(--ink-50);margin-top:4px}
.proj .one{margin-top:8px;font-size:14.5px;color:var(--ink-70)}
.empty-box{border:1px dashed #BDBBB0;padding:28px 22px;color:var(--ink-50);font-size:15px;background:rgba(255,255,255,.4)}

/* professor */
.prof{display:grid;gap:clamp(24px,4vw,48px);grid-template-columns:1fr;align-items:start}
@media(min-width:820px){.prof{grid-template-columns:250px 1fr}}
.portrait{aspect-ratio:3/4;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;position:relative;max-width:260px}
.portrait img{width:100%;height:100%;object-fit:cover}
.prof h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.04em}
.prof .nsub{font-size:15px;color:var(--ink-50);margin-top:2px}
.prof .title{margin-top:12px;font-size:16px;font-weight:600}
.prof .dept{font-size:14.5px;color:var(--ink-70)}
.contact-list{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14.5px}
.contact-list dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-50);letter-spacing:.06em;padding-top:3px}
.contact-list dd{margin:0}
.contact-list a{text-decoration:none;border-bottom:1px solid var(--line)}
.btnrow{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-o{display:inline-block;font-size:13.5px;text-decoration:none;border:1px solid var(--ink);padding:7px 13px;border-radius:2px;background:transparent;font-weight:600}
.btn-o:hover{background:var(--ink);color:#fff}
.btn-o.dark{background:var(--ink);color:#fff}
.btn-o.dark:hover{background:var(--copper);border-color:var(--copper)}
.interests{margin-top:22px}
.interests ol{list-style:none;margin:6px 0 0;padding:0;counter-reset:ri}
.interests li{counter-increment:ri;display:grid;grid-template-columns:30px 1fr;padding:9px 0;border-bottom:1px solid var(--line);position:relative}
.interests li::before{content:counter(ri,decimal-leading-zero);font-family:var(--mono);font-size:11.5px;color:var(--copper);padding-top:3px}
.interests .it{font-weight:700;font-size:15px}
.interests .is{display:block;font-size:13.5px;color:var(--ink-50);margin-top:1px}
.cv-sec{margin-top:clamp(34px,5vw,52px)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:1fr;gap:2px 22px;padding:14px 0;border-bottom:1px solid var(--line);position:relative}
@media(min-width:640px){.tl li{grid-template-columns:160px 1fr}}
.tl .period{font-family:var(--mono);font-size:12.5px;color:var(--ink-50);padding-top:3px}
.tl .t{font-weight:700;font-size:15.5px}
.tl .o{font-size:14.5px;color:var(--ink-70)}
.tl .d{font-size:13.5px;color:var(--ink-50);margin-top:2px}
.cv-cols{display:grid;gap:0 clamp(24px,4vw,48px);grid-template-columns:1fr}

/* members */
.pgroup{margin-bottom:clamp(30px,4vw,44px)}
.mgrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-top:18px}
.mcard{position:relative}
.mcard .ph{aspect-ratio:1/1;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;margin-bottom:11px;position:relative}
.mcard .ph img{width:100%;height:100%;object-fit:cover}
.mcard b{display:block;font-size:16px;letter-spacing:-.02em}
.mcard .sub{font-size:13px;color:var(--ink-50)}
.mcard .bio{font-size:13.5px;color:var(--ink-70);margin-top:6px;line-height:1.6}
.mcard .mail{font-family:var(--mono);font-size:11.5px;color:var(--ink-50);margin-top:5px;word-break:break-all}
.empty-note{color:var(--ink-50);font-size:14px;font-family:var(--mono);padding:14px 0}

/* news */
.news{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.news li{display:grid;grid-template-columns:1fr;gap:2px 22px;padding:18px 0;border-bottom:1px solid var(--line);position:relative}
@media(min-width:640px){.news li{grid-template-columns:130px 1fr}}
.news .date{font-family:var(--mono);font-size:12.5px;color:var(--copper);padding-top:3px}
.news .t{font-weight:700;font-size:16.5px}
.news .b{font-size:14.5px;color:var(--ink-70);margin-top:4px}
.news.compact .b{display:none}
.more{display:inline-block;margin-top:16px;font-size:14px;font-weight:600;color:var(--copper);text-decoration:none}
.more:hover{text-decoration:underline}

/* publications */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:clamp(30px,4vw,44px)}
.stat{background:var(--card);padding:18px 20px;position:relative}
.stat .n{font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-.04em;color:var(--deep);line-height:1.1}
.stat .l{font-size:13.5px;color:var(--ink-50);margin-top:4px}
.pubnote{font-size:12.5px;color:var(--ink-50);margin-bottom:10px;font-family:var(--mono)}
.pubtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.pubtabs button{font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border:1px solid var(--line);background:var(--card);border-radius:2px;cursor:pointer;color:var(--ink-70)}
.pubtabs button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.pubsec{margin-bottom:clamp(34px,5vw,50px)}
.yr{display:grid;grid-template-columns:1fr;gap:0 22px;position:relative}
@media(min-width:720px){.yr{grid-template-columns:80px 1fr}}
.yr>h4{font-family:var(--mono);font-size:14px;color:var(--copper);font-weight:500;padding-top:14px}
.pubs{list-style:none;margin:0;padding:0}
.pubs li{padding:12px 76px 12px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.7;position:relative;color:#2A3136}
.yr:first-of-type .pubs,.pubs.first{border-top:0}
.pubs li b{color:var(--ink)}
.pubs li a.lk{font-family:var(--mono);font-size:11.5px;color:var(--copper);text-decoration:none;border:1px solid rgba(184,97,42,.35);padding:1px 6px;border-radius:2px;margin-left:6px;white-space:nowrap}
.pubs li a.lk:hover{background:var(--copper);color:#fff}
.pubs li .pno{font-family:var(--mono);font-size:11.5px;color:var(--ink-50);margin-right:6px}

/* lecture */
.term{margin-bottom:clamp(34px,5vw,50px);position:relative}
.term-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.term-h h3{font-size:19px}
.badge{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#fff;background:#2E7D57;padding:3px 8px;border-radius:2px;font-weight:500}
.badge.plan{background:#8A9299}
.badge.new{background:var(--copper)}
.course{padding:18px 0;border-bottom:1px solid var(--line);position:relative}
.course h4{font-size:17.5px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.course .en{font-size:13.5px;color:var(--ink-50);font-weight:500}
.course .lvl{font-family:var(--mono);font-size:10.5px;color:var(--ink-50);border:1px solid var(--line);padding:1px 6px;border-radius:2px;font-weight:500}
.course .desc{margin-top:6px;font-size:14.5px;color:var(--ink-70);max-width:78ch}
.files{list-style:none;margin:10px 0 0;padding:0}
.files li{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:8px 76px 8px 12px;border-left:2px solid var(--line);font-size:14px;position:relative}
.files .ft{flex:1 1 220px;font-weight:600}
.files .fm{font-family:var(--mono);font-size:11.5px;color:var(--ink-50)}
.files a.dl{text-decoration:none;font-size:12.5px;border:1px solid var(--ink);padding:3px 10px;border-radius:2px;white-space:nowrap}
.files a.dl:hover{background:var(--ink);color:#fff}
.nofiles{font-size:13px;color:var(--ink-50);margin-top:8px;font-family:var(--mono)}

/* join */
.join{background:var(--deep);color:#E6EBEB}
.join h2{color:#fff;font-size:clamp(23px,3.4vw,32px)}
.join .lede{color:#D3DDDF;margin-top:16px}
.join a.btn{display:inline-block;margin-top:22px;text-decoration:none;font-size:15px;padding:12px 22px;border-radius:2px;background:var(--copper);color:#fff;font-weight:700}
.join a.btn:hover{background:var(--copper-lt)}

/* contact */
.contact-grid{display:grid;gap:clamp(24px,4vw,48px);grid-template-columns:1fr}
@media(min-width:860px){.contact-grid{grid-template-columns:1fr 1.1fr}}
.facts{border-top:2px solid var(--ink)}
.facts .row{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;position:relative}
.facts .k{flex:0 0 96px;color:var(--ink-50);font-size:13.5px;padding-top:2px}
.facts .v{flex:1;min-width:0}
.mapbox{aspect-ratio:4/3;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-50);font-family:var(--mono);font-size:11.5px;line-height:1.8}
.mapbox iframe{width:100%;height:100%;border:0;display:block}

footer{background:var(--deep-2);color:#8FA3AB;padding-block:30px;font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:space-between}

<script>

var LANG = 'ko', ADMIN = false, DIRTY = false, PAGE = 'home', PUBTAB = 'all';
var PAGES = ['home','news','research','professor','members','publications','lecture','contact'];
try{var sl=localStorage.getItem('speed-lang');if(sl==='en'||sl==='ko')LANG=sl;}catch(e){}

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nl(s){return esc(s).replace(/\n/g,'<br>');}
function get(p){try{return p.split('.').reduce(function(o,k){return o[k];},DATA);}catch(e){return undefined;}}
function setp(p,v){var ks=p.split('.'),last=ks.pop();var o=ks.reduce(function(o,k){return o[k];},DATA);o[last]=v;dirty();}
function dirty(){DIRTY=true;var d=document.getElementById('dirty');if(d)d.textContent='● 저장하지 않은 변경이 있습니다';}
function clean(){DIRTY=false;var d=document.getElementById('dirty');if(d)d.textContent='';}
function L(o){return (o&&typeof o==='object')?(o[LANG]||''):(o||'');}
function T(path){return '<span class="ed" data-path="'+path+'.'+LANG+'">'+nl(get(path+'.'+LANG))+'</span>';}
function S(path){return '<span class="ed" data-path="'+path+'">'+nl(get(path))+'</span>';}
function show(o){return ADMIN || !!L(o);}
function CTL(list,i){return '<span class="ctl">'
 +'<button type="button" data-act="up" data-list="'+list+'" data-i="'+i+'" title="위로">↑</button>'
 +'<button type="button" data-act="down" data-list="'+list+'" data-i="'+i+'" title="아래로">↓</button>'
 +'<button type="button" class="del" data-act="del" data-list="'+list+'" data-i="'+i+'" title="삭제">✕</button></span>';}
function ADD(list,tpl,label){return '<div class="addrow"><button type="button" class="addbtn" data-act="add" data-list="'+list+'" data-tpl="'+tpl+'">+ '+esc(label)+'</button></div>';}
function bl(ko,en){return {ko:ko,en:en};}
function href(h){return ADMIN?'':' href="'+esc(h)+'"';}
function ko(){return LANG==='ko';}
function boldPI(html){return ADMIN?html:html.replace(/(J\.-H\. Jung|J\. Jung|Jun-Hyung Jung)(\*)?/g,'<b>$1$2</b>');}
function photoHTML(src,path,ph){
  var inner = src ? '<img src="'+esc(src)+'" alt="" loading="lazy">' : '<div class="ph-empty">'+esc(ph)+'</div>';
  return inner+'<span class="photobtns"><button type="button" data-act="photo" data-path="'+path+'">사진 선택</button>'
   +'<button type="button" data-act="photopath" data-path="'+path+'">경로 입력</button>'
   +(src?'<button type="button" data-act="photodel" data-path="'+path+'">지우기</button>':'')+'</span>';
}
function trace(){ /* decorative switching waveform for page headers */
  var d='M0 70',x=0,hi=true;var w=[18,10,24,8,30,6,34,6,30,8,24,10,18,14,12,18,8,22,6,26,6,22,8,18,12,14];
  for(var i=0;i<w.length;i++){x+=w[i];d+=' H'+x+' V'+(hi?30:70);hi=!hi;}
  return '<svg class="trace" viewBox="0 0 '+x+' 100" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="#2F5A69" stroke-width="1.5"/></svg>';
}
function phead(key,title,sub){return '<div class="phead"><div class="wrap"><div class="k">'+esc(key)+'</div><h1>'+title+'</h1>'+(sub?'<p class="s">'+sub+'</p>':'')+'</div>'+trace()+'</div>';}

function pickPhoto(path){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){var img=new Image();img.onload=function(){var max=900,s=Math.min(1,max/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      setp(path,cv.toDataURL('image/jpeg',0.84));renderAll();};img.src=rd.result;};
    rd.readAsDataURL(f);};
  inp.click();
}

/* ---------- PWM animation ---------- */
/* ---------- hero animation: AI (brain) -> CBPWM -> motor ---------- */
var pwmRAF=null;
var HERO={W:1400,H:300,
  brain:{lobes:[[120,128,78,62],[190,104,80,62],[248,146,52,52],[168,178,82,40],[236,206,32,20]]},
  pwm:{x0:360,x1:1010,TOP:112,AMP:58,HI:222,LO:268,CY:2,MF:9},
  motor:{cx:1250,cy:150,Ro:122,Ri:86,Rr:66}};
function rng(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
function inBrain(x,y,m){var L=HERO.brain.lobes;for(var i=0;i<L.length;i++){var dx=(x-L[i][0])/(L[i][2]-m),dy=(y-L[i][1])/(L[i][3]-m);if(dx*dx+dy*dy<=1)return true;}return false;}
function brainNet(){
  if(HERO.net)return HERO.net;
  var r=rng(7),N=[],tries=0;
  while(N.length<44&&tries<5000){tries++;var x=40+r()*250,y=45+r()*180;if(!inBrain(x,y,10))continue;
    var ok=true;for(var i=0;i<N.length;i++){var dx=N[i][0]-x,dy=N[i][1]-y;if(dx*dx+dy*dy<22*22){ok=false;break;}}if(ok)N.push([x,y]);}
  var E=[],seen={};
  N.forEach(function(p,i){var d=N.map(function(q,j){return [(q[0]-p[0])*(q[0]-p[0])+(q[1]-p[1])*(q[1]-p[1]),j];}).sort(function(a,b){return a[0]-b[0];});
    for(var k=1;k<=3&&k<d.length;k++){var j=d[k][1],key=Math.min(i,j)+'-'+Math.max(i,j);if(!seen[key]&&d[k][0]<55*55){seen[key]=1;E.push([i,j]);}}});
  HERO.net={N:N,E:E,phase:N.map(function(){return r()*6.28;}),rate:N.map(function(){return 0.6+r()*1.6;})};return HERO.net;
}
function heroSVG(){
  var h=HERO,net=brainNet(),m=h.motor,o='';
  o+='<svg class="pwm" viewBox="0 0 '+h.W+' '+h.H+'" role="img" aria-label="AI, carrier-based PWM and a rotating motor">';
  o+='<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    +'<radialGradient id="rotg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#274E5C"/><stop offset="1" stop-color="#173845"/></radialGradient>'
    +'<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D9853F"/></marker></defs>';
  /* brain: stroke union trick */
  var L=h.brain.lobes;
  o+='<g><path d="M206 212 q8 30 2 52" stroke="#4E7381" stroke-width="12" fill="none" stroke-linecap="round"/>'+L.map(function(e){return '<ellipse cx="'+e[0]+'" cy="'+e[1]+'" rx="'+e[2]+'" ry="'+e[3]+'" fill="none" stroke="#4E7381" stroke-width="5"/>';}).join('')
    +L.map(function(e){return '<ellipse cx="'+e[0]+'" cy="'+e[1]+'" rx="'+e[2]+'" ry="'+e[3]+'" fill="#143742"/>';}).join('')
    +'</g>';
  o+='<g id="nn-e" stroke-width="1.1">'+net.E.map(function(e,i){var a=net.N[e[0]],b=net.N[e[1]];return '<line id="nne'+i+'" x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="#3A6878"/>';}).join('')+'</g>';
  o+='<g id="nn-n">'+net.N.map(function(p,i){return '<circle id="nnn'+i+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4" fill="#9DB3BB"/>';}).join('')+'</g>';
  o+='<g id="nn-s" filter="url(#glow)"></g>';
  /* connectors */
  o+='<path d="M312 140 H346" stroke="#D9853F" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)" fill="none"/>';
  o+='<path d="M1022 245 H1110" stroke="#D9853F" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)" fill="none"/>';
  /* PWM */
  var p=h.pwm;
  o+='<g fill="none" stroke-linecap="round"><line x1="'+p.x0+'" y1="'+p.TOP+'" x2="'+p.x1+'" y2="'+p.TOP+'" stroke="#2A4A56" stroke-dasharray="2 6"/>'
    +'<line x1="'+p.x0+'" y1="'+p.LO+'" x2="'+p.x1+'" y2="'+p.LO+'" stroke="#2A4A56" stroke-dasharray="2 6"/>'
    +'<path id="carrier" stroke="#4E7381" stroke-width="1.2"/><path id="ref" stroke="#D9853F" stroke-width="2.4"/><path id="pulse" stroke="#CFDCDF" stroke-width="1.8"/></g>';
  /* motor: stator (ring with 12 slots + coils) */
  var cx=m.cx,cy=m.cy,sl=12,pc=['#D9853F','#6FB3C8','#D8E1E3'];
  function P(r,a){a=(a-90)*Math.PI/180;return (cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2);}
  function arc(r1,r2,a0,a1){return 'M'+P(r2,a0)+' A'+r2+' '+r2+' 0 0 1 '+P(r2,a1)+' L'+P(r1,a1)+' A'+r1+' '+r1+' 0 0 0 '+P(r1,a0)+'Z';}
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((m.Ro+m.Ri)/2)+'" fill="none" stroke="#2E5968" stroke-width="'+(m.Ro-m.Ri)+'"/>';
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+m.Ro+'" fill="none" stroke="#5A8594" stroke-width="1.4"/><circle cx="'+cx+'" cy="'+cy+'" r="'+m.Ri+'" fill="none" stroke="#5A8594" stroke-width="1"/>';
  for(var k=0;k<sl;k++){var ac=k*30+15;
    o+='<path d="'+arc(m.Ri-0.5,m.Ri+24,ac-7.5,ac+7.5)+'" fill="#0E2630"/>';
    o+='<path id="wd'+k+'" d="'+arc(m.Ri+5,m.Ri+22,ac-5.6,ac+5.6)+'" fill="'+pc[k%3]+'" opacity=".5"/>';}
  /* rotor with surface-mounted magnets (4 poles) */
  o+='<g id="rotor"><circle cx="'+cx+'" cy="'+cy+'" r="'+m.Rr+'" fill="url(#rotg)" stroke="#5A8594" stroke-width="1.2"/>';
  for(var q=0;q<4;q++){var a0=q*90,Nn=q%2===0;
    o+='<path d="'+arc(m.Rr-13,m.Rr+1,a0-34,a0+34)+'" fill="'+(Nn?'#C4692C':'#3F8499')+'"/>';
    var tp=P(m.Rr-26,a0).split(' ');
    o+='<text x="'+tp[0]+'" y="'+(+tp[1]+4)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="600" fill="'+(Nn?'#F2B27A':'#9FD0DE')+'">'+(Nn?'N':'S')+'</text>';}
  o+='<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="#9DB3BB"/><rect x="'+(cx-3)+'" y="'+(cy-14)+'" width="6" height="7" fill="#173845"/></g>';
  o+='</svg>';
  return o;
}
function startPWM(){
  var h=HERO,p=h.pwm,net=brainNet(),m=h.motor;
  var refEl=document.getElementById('ref'),carEl=document.getElementById('carrier'),pulEl=document.getElementById('pulse');if(!refEl)return;
  if(pwmRAF){cancelAnimationFrame(pwmRAF);pwmRAF=null;}
  var W=p.x1-p.x0,NS=520,rot=document.getElementById('rotor'),sg=document.getElementById('nn-s');
  var nodes=net.N.map(function(_,i){return document.getElementById('nnn'+i);}),edges=net.E.map(function(_,i){return document.getElementById('nne'+i);}),wd=[];
  for(var k=0;k<12;k++)wd.push(document.getElementById('wd'+k));
  function tri(x){x=x-Math.floor(x);return 1-4*Math.abs(x-0.5);}
  var spikes=[],hot={};
  function draw(ph,t){
    var r=[],c=[],q=[],prev=null;
    for(var i=0;i<=NS;i++){var x=p.x0+i*W/NS,u=i/NS,rf=0.86*Math.sin(2*Math.PI*p.CY*u+ph),cr=tri(p.CY*p.MF*u);
      r.push((i?'L':'M')+x.toFixed(1)+' '+(p.TOP-p.AMP*rf).toFixed(1));c.push((i?'L':'M')+x.toFixed(1)+' '+(p.TOP-p.AMP*cr).toFixed(1));
      var sv=rf>cr?p.HI:p.LO;if(prev===null)q.push('M'+x.toFixed(1)+' '+sv);else if(sv!==prev)q.push('L'+x.toFixed(1)+' '+prev,'L'+x.toFixed(1)+' '+sv);else q.push('L'+x.toFixed(1)+' '+sv);prev=sv;}
    refEl.setAttribute('d',r.join(' '));carEl.setAttribute('d',c.join(' '));pulEl.setAttribute('d',q.join(' '));
    /* motor: mechanical angle, 2 pole pairs */
    var thm=ph*1.6,the=2*thm;
    if(rot)rot.setAttribute('transform','rotate('+(thm*180/Math.PI).toFixed(2)+' '+m.cx+' '+m.cy+')');
    for(var k=0;k<12;k++){var slotAng=(k*30+15)*Math.PI/180,phs=k%3;var cur=Math.cos(the-phs*2*Math.PI/3-2*slotAng*0);wd[k].setAttribute('opacity',(0.25+0.75*Math.abs(cur)).toFixed(2));}
    /* brain twinkle */
    var ts=t/1000;
    for(var n=0;n<nodes.length;n++){var v=Math.pow(Math.max(0,Math.sin(ts*net.rate[n]+net.phase[n])),8);
      nodes[n].setAttribute('r',(3.2+2.6*v).toFixed(2));nodes[n].setAttribute('fill',v>0.35?'#F2B27A':'#9DB3BB');}
    if(Math.random()<0.18&&spikes.length<7){var ei=Math.floor(Math.random()*edges.length),dir=Math.random()<.5;spikes.push({e:ei,t0:ts,dir:dir});}
    var html='';spikes=spikes.filter(function(s){var k=(ts-s.t0)/0.55;if(k>1){edges[s.e].setAttribute('stroke','#3A6878');return false;}
      var e=net.E[s.e],A=net.N[s.dir?e[0]:e[1]],B=net.N[s.dir?e[1]:e[0]];edges[s.e].setAttribute('stroke','#B8612A');
      html+='<circle cx="'+(A[0]+(B[0]-A[0])*k).toFixed(1)+'" cy="'+(A[1]+(B[1]-A[1])*k).toFixed(1)+'" r="3" fill="#FFD3A8"/>';return true;});
    sg.innerHTML=html;
  }
  draw(0,0);if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var ph=0,last=0;(function frame(t){if(t-last>33){ph+=0.02;draw(ph,t);last=t;}pwmRAF=requestAnimationFrame(frame);})(0);
}

document.documentElement.lang=LANG;
route();
</script>
